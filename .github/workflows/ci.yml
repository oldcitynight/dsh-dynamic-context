name: Direct fake-backend tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.x']
    env:
      TMPDIR: ${{ github.workspace }}/.test-tmp
      DSH_HOME: ${{ github.workspace }}/.test-home/dsh
      DSH_AGENTS_HOME: ${{ github.workspace }}/.test-home/agents
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Prepare isolated test tools and directories
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep util-linux
          mkdir -p "$TMPDIR" "$DSH_HOME" "$DSH_AGENTS_HOME"
          # Ubuntu's runner policy can prohibit unprivileged user namespaces.
          # This only changes the disposable CI machine used for sandbox tests.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Cache the exact task-graph Bundle
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { resolve } from 'node:path'
          const name = 'dsh-better-task-grapth'
          const { peerDependencies } = JSON.parse(readFileSync('package.json'))
          const { packages } = JSON.parse(readFileSync('package-lock.json'))
          const { version, integrity } = packages['node_modules/' + name]
          assert.equal(version, peerDependencies[name])
          assert.match(version, /^\d+\.\d+\.\d+-rc\.\d+$/)
          const file = name + '-' + version + '.tgz'
          const url = 'https://github.com/oldcitynight/' + name + '/releases/download/v' + version + '/' + file
          const local = resolve(process.env.TMPDIR, file)
          execFileSync('curl', ['--fail', '--silent', '--show-error', '--location', '--retry', '4', '--output', local, url], { stdio: 'inherit' })
          assert.equal('sha512-' + createHash('sha512').update(readFileSync(local)).digest('base64'), integrity)
          execFileSync('npm', ['cache', 'add', local], { stdio: 'inherit' })
          NODE
      - run: npm ci --prefer-offline
      - run: npm test
      - run: npm pack --dry-run
