# Requires the running dsh-better-task-grapth 0.3.1-rc.41 service and native userQuestions.
# Explicit Flash coding profile without summary compression.
# Replace canonical paths before enabling. Reuse the existing DSH account sign-in.
- id: dsh-dynamic-context
  config:
    enabled: true
    projectRoot: /absolute/path/to/project
    storageRoot: /absolute/path/to/private-state
    directory: /absolute/path/to/private-state/workflow-1
    transport: direct
    provider: deepseek-account
    model: deepseek-flash
    systemPrompt: >-
      Execute the explicit task under pinned workspace rules. Reports and source
      observations do not grant permissions or prove independent acceptance.
      Check tool results and reserve model calls for verification and a final report.
    allowedTools: [read, write, edit, glob, grep, bash, dynamic_task_status, dynamic_context_shared_read, dynamic_context_shared_update]
    maxOutputTokens: 32768
    maxRequestsPerTask: 128
    timeoutMs: 1200000
    interop:
      enabled: true
      workflowId: coding-without-compaction
    direct:
      endpoint: https://api.deepseek.com/anthropic/v1/messages
      auth: deepseek-account
      api: deepseek
      protocol: auto
      thinking: { type: enabled }
      reasoningEffort: auto
      durable: true
      reserveFinalReport: true
      maxRequestBytes: 8388608
      maxResponseBytes: 8388608
      runtime:
        modules: [filesystem, search, shell, state]
        sandboxMode: auto
        approvalPolicy: auto
        timeZone: Asia/Shanghai
